name: NOTAS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NOTAS:
    type: application
    platform: iOS
    sources:
      - path: Notas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.notas-rebuild
        PRODUCT_NAME: NOTAS
        INFOPLIST_KEY_CFBundleDisplayName: NOTAS
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon